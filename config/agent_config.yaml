# Agent Configuration
AGENT_LOG_LEVEL: INFO
AGENT_TIMEOUT_SECONDS: 300
MAX_RETRIES: 3
RETRY_DELAY_SECONDS: 5

# LLM Configuration
LLAMA_API_BASE: http://localhost:11434
LLAMA_MODEL: llama2:7b
LLAMA_TEMPERATURE: 0.7
LLAMA_MAX_TOKENS: 4096
LLAMA_CONTEXT_WINDOW: 4096

# Forecasting Configuration
FORECAST_METHODS:
  - exponential_smoothing
  - moving_average
  - arima
  - prophet
  - machine_learning
FORECAST_HORIZON_DEFAULT: 12
FORECAST_CONFIDENCE_LEVEL: 0.95

# Inventory Configuration
INVENTORY_SERVICE_LEVEL_DEFAULT: 0.95
INVENTORY_REVIEW_PERIOD_DAYS: 14
ABC_A_THRESHOLD: 0.80
ABC_B_THRESHOLD: 0.95
XYZ_CV_THRESHOLD_XY: 0.25
XYZ_CV_THRESHOLD_YZ: 1.0

# Procurement Configuration
SUPPLIER_QUALITY_WEIGHT: 0.35
SUPPLIER_RELIABILITY_WEIGHT: 0.35
SUPPLIER_COST_WEIGHT: 0.15
SUPPLIER_CONCENTRATION_WEIGHT: 0.10
SUPPLIER_SINGLE_SOURCE_WEIGHT: 0.05
DUAL_SOURCE_COST_THRESHOLD: 0.15

# Network Configuration
FACILITY_SERVICE_LEVEL_TARGET: 0.95
NETWORK_OPTIMIZATION_HORIZON: 12
TRANSPORTATION_COST_PER_MILE: 0.50

# Risk Configuration
RISK_ASSESSMENT_FREQUENCY_DAYS: 30
RESILIENCE_SCORE_THRESHOLD: 0.7
BULLWHIP_WARNING_THRESHOLD: 1.2
SUPPLY_CHAIN_VISIBILITY_DAYS: 30

# Data Configuration
DATA_RETENTION_DAYS: 365
DEFAULT_DATE_FORMAT: "%Y-%m-%d"
DEFAULT_CURRENCY: USD
